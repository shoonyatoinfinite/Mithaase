[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "lib/data/initial-data.ts,lib/auth/server.ts,.next/**,.netlify/**"
  SECRETS_SCAN_OMIT_KEYS = "NEON_AUTH_BASE_URL,NEXT_PUBLIC_NEON_AUTH_BASE_URL,NEON_AUTH_COOKIE_SECRET,NEXT_PUBLIC_STORE_UPI_ID,NEXT_PUBLIC_STORE_UPI_NAME,ADMIN_SECRET_KEY,ADMIN"

